# Minimal Supabase CLI config so the GitHub workflow can deploy the edge functions.
project_id = "licensing-bros"

[functions.tutor]
verify_jwt = true

[functions.generate]
verify_jwt = true

[functions.session]
verify_jwt = true

[functions.lesson]
verify_jwt = true

[functions.live-token]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

[functions.library]
verify_jwt = true

[functions.assistant]
verify_jwt = true

[functions.research]
verify_jwt = true

[functions.voice]
verify_jwt = true

# The hourly scheduler calls this without a user sign-in; it checks the x-automation-key header or the user itself.
[functions.automations]
verify_jwt = false

# Stripe calls this one directly; it checks the Stripe-Signature header instead of a sign-in.
[functions.stripe-webhook]
verify_jwt = false
